[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-linker"
version = "1.0.0"
description = "A lightweight CLI tool to natively link Windows folders to WSL 2 folders with bi-directional directory mapping and execution proxying."
readme = "README.md"
authors = [
    { name = "Fauzul", email = "fauzul@example.com" } # Placeholder email for package initialization
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console"
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/fauzul/wsl-linker"
"Bug Tracker" = "https://github.com/fauzul/wsl-linker/issues"

[project.scripts]
wsl-linker = "wsl_linker:main"
